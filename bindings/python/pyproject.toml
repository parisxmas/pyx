[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyx-db"
version = "0.1.0"
description = "Pyx — embeddable document database (Python binding)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pyx contributors" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/pyx-db/pyx"
Issues = "https://github.com/pyx-db/pyx/issues"

[tool.setuptools.packages.find]
include = ["pyx*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pyx = ["*.dylib", "*.so", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
