{% extends "notes/base.html" %}
{% block title %}Edit — {{ note.title }}{% endblock %}
{% block content %}
<h1>Edit {{ note.title }}</h1>
<form method="post" action="{% url 'notes:edit' note._id %}">
    <input type="hidden" name="u" value="{{ request.GET.u|default:'demo' }}">
    <input type="text" name="title" value="{{ note.title }}" required>
    <textarea name="body" rows="8">{{ note.body }}</textarea>
    <input type="text" name="tags" value="{{ note.tags|join:', ' }}">
    <p class="meta">
        Two tabs editing this at once will both save without losing
        either's writes — pyx's <code>run_optimistic</code> retries
        on conflict.
    </p>
    <button type="submit">Save</button>
    <a href="{% url 'notes:detail' note._id %}?u={{ request.GET.u|default:'demo' }}">Cancel</a>
</form>
{% endblock %}
